# Windows (VST3 + Standalone) をクラウドでビルドし、インストーラー(.exe)と手動用zipを作る
# 「Actions」タブから手動実行。release_tag（例 v0.2.0-beta1）を入れると、そのReleaseに添付する
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '既存Releaseに添付する場合のタグ（例 v0.2.0-beta1）。空ならテストビルドのみ'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          T="${{ inputs.release_tag }}"
          if [[ -n "$T" ]]; then V="${T#v}"; echo "VER=${V%%-*}" >> $GITHUB_ENV; else echo "VER=0.0.0-dev" >> $GITHUB_ENV; fi
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DEQA_COPY_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package (installer)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VER" packaging\win\installer.iss
      - name: Package (manual zip)
        shell: pwsh
        run: |
          $art = "build\EQAnatomyLab2_artefacts\Release"
          $dir = "build\zip\EQAnatomyLab2-$env:VER-win64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse "$art\VST3\EQ Anatomy Lab 2.vst3" $dir
          Copy-Item "$art\Standalone\EQ Anatomy Lab 2.exe" $dir
          Copy-Item "packaging\win\license-win.txt" "$dir\license.txt"
          Copy-Item "packaging\manual\README-win.txt" "$dir\HOW_TO_INSTALL.txt"
          Compress-Archive -Path $dir -DestinationPath "dist\EQAnatomyLab2-$env:VER-win64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Upload to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.exe dist/*.zip --clobber -R "${{ github.repository }}"
